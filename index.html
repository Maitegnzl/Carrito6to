<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boutique Minimal - Carrito de Compras</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <nav class="navbar navbar-light bg-white shadow-sm px-4">
    <a class="navbar-brand fw-bold fs-3 text-pink" href="#">Boutique Minimal</a>
    <button id="cart-btn" class="btn btn-outline-pink position-relative">
      🛍️ Carrito
      <span id="cart-count" class="badge bg-pink position-absolute top-0 start-100 translate-middle">0</span>
    </button>
  </nav>

  <main class="container my-5">
    <div id="products-container" class="row g-4"></div>
  </main>

  <!-- Modal del carrito -->
  <div class="modal fade" id="cartModal" tabindex="-1" aria-labelledby="cartModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="cartModalLabel">Tu Carrito 🩷</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <ul id="cart-items" class="list-group mb-3"></ul>
          <h5 class="text-end mt-3">Total: $<span id="total">0</span></h5>
        </div>
        <div class="modal-footer border-0">
          <button id="clear-cart" class="btn btn-outline-secondary">Vaciar</button>
          <button id="buy" class="btn btn-pink">Finalizar compra</button>
        </div>
      </div>
    </div>
  </div>

  <div id="message" class="alert alert-pink position-fixed top-0 start-50 translate-middle-x mt-4 d-none" role="alert">
    ¡Compra realizada con éxito! 💖
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
